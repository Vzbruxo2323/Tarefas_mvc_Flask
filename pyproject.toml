
[project]
name = "tarefas"
version = "0.1.0"
description = "Sistema de gerenciamento de tarefas com Flask"
readme = "README.md"
authors = [
    { name = "Vzbruxo2323" }
]
requires-python = ">=3.11,<3.15"

dependencies = [
    "flask>=3.1.3",
    "gunicorn>=27.0.1",
    "mysql-connector-python>=26.10.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
